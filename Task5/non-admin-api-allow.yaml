apiVersion: v1
kind: Namespace
metadata:
  name: traffic-zone
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: front-end-app
  namespace: traffic-zone
spec:
  replicas: 1
  selector:
    matchLabels:
      role: front-end
  template:
    metadata:
      labels:
        role: front-end
    spec:
      containers:
        - name: nginx
          image: nginx:1.27-alpine
          ports:
            - name: http
              containerPort: 80
        - name: probe
          image: busybox:1.36
          command: ["sh", "-c", "sleep infinity"]
          readinessProbe:
            exec:
              command: ["wget", "-q", "-O", "/dev/null", "http://127.0.0.1:80"]
            initialDelaySeconds: 2
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: front-end-app
  namespace: traffic-zone
spec:
  selector:
    role: front-end
  ports:
    - name: http
      port: 80
      targetPort: 80
---
